name: Compilar Pedscont. APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/compile.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair ZIP do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP" || { echo 'Envie o ZIP para a raiz do repositorio'; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          test -n "$PROJECT" || { echo 'Projeto Android nao encontrado no ZIP'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
      - name: Gerar APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pedscont-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

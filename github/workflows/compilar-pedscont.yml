name: Compilar PedScont ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'PedScont_GitHub.zip'
      - '.github/workflows/compilar-pedscont.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto ZIP
        shell: bash
        run: |
          test -f PedScont_GitHub.zip || { echo 'Arquivo PedScont_GitHub.zip nao encontrado na raiz.'; exit 1; }
          mkdir -p projeto
          unzip -q PedScont_GitHub.zip -d projeto
          test -f projeto/PedScont/settings.gradle.kts || { echo 'Estrutura do ZIP inesperada.'; exit 1; }

      - name: Compilar APK de teste
        working-directory: projeto/PedScont
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PedScont-APK
          path: projeto/PedScont/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
